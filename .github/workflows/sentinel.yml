name: Sentinel security audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install .
      - run: sentinel scan ./examples/vulnerable_reentrancy --mock --output ./reports
      - name: Require verified fixture remediation
        run: |
          grep -R "Final Outcome" -A2 reports | grep -q "\*\*verified\*\*"
